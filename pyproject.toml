[project]
name = "multi-agent-lab"
version = "0.1.0"
description = "A local, provider-neutral multi-agent collaboration workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[project.scripts]
multi-agent-lab = "multi_agent_lab.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
